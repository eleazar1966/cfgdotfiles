[config]
wallpaper_common = true

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty-colors.conf'
output_path = '~/.config/kitty/colors.conf'

[templates.rofi]
input_path = '~/.config/matugen/templates/rofi-colors.rasi'
output_path = '~/.config/rofi/colors.rasi'

[templates.waybar]
input_path = '~/.config/matugen/templates/waybar-colors.css'
output_path = '~/.config/waybar/colors.css'

[templates.niri]
input_path = '~/.config/matugen/templates/niri_template.kdl'
output_path = '~/.config/niri/colors.kdl'

[templates.fuzzel]
input_path = '~/.config/matugen/templates/fuzzel.ini'
output_path = '~/.config/fuzzel/fuzzel.ini'

[templates.cava]
input_path = '~/.config/matugen/templates/cava-colors.ini'
output_path = '~/.config/cava/themes/matugen-colors'
# Usar -USR2 es correcto, pero asegúrate de que Matugen tenga permisos de ejecución
post_hook = 'sleep 0.1 && pkill -USR2 cava'
