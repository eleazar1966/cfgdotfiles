     libtirpc llvm lm-sensors lto lua mad mercurial minizip mms mng \
     modemmanager modplug mp3 mp4 mpd mpeg mpris mtp multilib \
     ncurses netapi network niri nls npm ogg openal opencl opengl \
     openh264 openmp opus pam pango pcre pdf perl pgo pipewire playlist \
