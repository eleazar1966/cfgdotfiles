COMMON_FLAGS="-march=znver3 -O3 -pipe -flto=16  -fgraphite-identity -floop-nest-optimize"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
CPU_FLAGS_X86="aes avx avx2 bmi1 bmi2 f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 sse4a ssse3 vpclmulqdq"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# --- AJUSTES DE PORTAGE ---
PORTDIR="/var/db/repos/gentoo"
DISTDIR="/var/cache/distfiles"
PKGDIR="/var/cache/binpkgs"
PORTAGE_TMPDIR="/var/tmp"
PORTAGE_LOGDIR="/var/log/portage"
PORTAGE_COMPRESS="zstd"
PORTAGE_COMPRESS_FLAGS="-19"
PORTAGE_NICENESS="19"
PORTAGE_IONICE_COMMAND="ionice -c 3 -p \${PID}"
BINPKG_FORMAT="gpkg"
PYTHON_TARGETS="python3_12 python3_13"
USE_EXPAND="PYTHON_TARGETS"

# --- CONFIGURACIÓN DE LOCALIZACIÓN (ESPAÑOL) ---
LINGUAS="es"
L10N="es-ES es"
LANG="es_ES.utf8"
LC_MESSAGES="C.utf8"

# --- LICENCIAS Y TIPO DE SISTEMA ---
ACCEPT_LICENSE="*"
ACCEPT_KEYWORDS="~amd64"

# Limpia los distfiles después de cada emerge exitoso
FEATURES="parallel-fetch parallel-install clean-logs candy distlocks"

# --- CONFIGURACIÓN DE OPTIMIZACIÓN Y PARALELISMO ---

MAKEOPTS="--jobs 16 --load-average 15"
EMERGE_DEFAULT_OPTS="--jobs=16 --load-average=15 --autounmask=y --autounmask-write=y --with-bdeps=y --complete-graph=y"

# --- CONFIGURACIÓN DE HARDWARE Y ENTORNO ---
INPUT_DEVICES="libinput"

# Define los objetivos de compilación para LLVM
LLVM_TARGETS="AMDGPU X86"

# Define la arquitectura específica de tu APU (Cezanne)
AMDGPU_TARGETS="gfx90c"
GALLIUM_DRIVERS="radeonsi"

VIDEO_CARDS="amdgpu radeonsi radeon"
OFFICE_IMPLEMENTATION="libreoffice"
LIBREOFFICE_EXTENSIONS="nlpsolver scripting-beanshell scripting-javascript wiki-publisher presenter-console presenter-minimizer"

# --- AJUSTES DE BOOTLOADER
DRACUT_MODULES="plymouth"
GRUB_PLATFORMS="efi-64"

# --- AJUSTE GLOBAL DE USES ---
USE="X a52 aac acl acpi alsa amd64 amdgpu amf appindicator audio avif \
     backlight bash-completion bcrypt bluetooth branding btrfs bzip2 \
     cairo cdda cdio cdr cet compress-zstd crypt cube cue cups \
     custom-cflags custom-modes dbus discid dracut dri drm dts dvd \
     dvdr echo-cancel egl elogind encode evdev exif extra ffmpeg \
     fingerprints flac freetype gdbm gif gimp git gles2 gpm gps \
     graphite gstreamer gtk gtk4 gui hwaccel iconv icu initramfs \
     introspection ipv6 jack java joystick jpeg jpegxl lame lcms \
     libnotify libtirpc llvm lm-sensors lto lua mad mercurial minizip mms \
     mng modemmanager modplug mp3 mp4 mpd mpeg mpris mtp multilib \
     ncurses netapi network niri nls npm ogg openal opencl opengl \
     openh264 openmp opus pam pango pcre pdf perl pgo pipewire \
     playlist plymouth png policykit portaudio postscript postproc \
     ppds pulseaudio python qml qt6 readline scanner screencast sdl \
     seccomp smartcard smp sndfile sndio sound sound-server spell \
     ssl startup-notification svg system-llvm taglib teamd \
     test-rust theora tiff tk tkip tray truetype twolame udev udisks \
     unicode unwind upower usb utils vaapi vcd vdpau \
     verify-provenance verify-sig vlc vorbis vpx vulkan wavpack wayland webdav \
     webp wifi wmf wow64 wxwidgets x264 x265 xattr xcb xcsecurity \
     xephyr xft xml xnest xorg xpm xv xvfb xvid zlib zstd -abi_x86_32 \
     -intel -minimal -nvidia -systemd -telemetry magic justify \
     led fuse"

GENTOO_MIRRORS="http://tux.rainside.sk/gentoo/ \
ftp://tux.rainside.sk/gentoo/"
