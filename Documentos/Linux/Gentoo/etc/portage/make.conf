COMMON_FLAGS="-march=znver3 -O3 -pipe -flto=16  -fgraphite-identity -floop-nest-optimize"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
CPU_FLAGS_X86="aes avx avx2 bmi1 bmi2 f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 sse4a ssse3 vpclmulqdq"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# --- AJUSTES DE PORTAGE ---
PORTDIR="/var/db/repos/gentoo"
DISTDIR="/var/cache/distfiles"
PKGDIR="/var/cache/binpkgs"
PORTAGE_TMPDIR="/var/tmp"
PORTAGE_LOGDIR="/var/log/portage"
PORTAGE_COMPRESS="zstd"
PORTAGE_COMPRESS_FLAGS="-19"
PORTAGE_NICENESS="19"
PORTAGE_IONICE_COMMAND="ionice -c 3 -p \${PID}"
BINPKG_FORMAT="gpkg"
PYTHON_TARGETS="python3_12 python3_13"
USE_EXPAND="PYTHON_TARGETS"

# --- CONFIGURACIÓN DE LOCALIZACIÓN (ESPAÑOL) ---
LINGUAS="es"
L10N="es-ES es"
LANG="es_ES.utf8"
LC_MESSAGES="C.utf8"

# --- LICENCIAS Y TIPO DE SISTEMA ---
ACCEPT_LICENSE="*"
ACCEPT_KEYWORDS="~amd64"

# Limpia los distfiles después de cada emerge exitoso
FEATURES="parallel-fetch parallel-install clean-logs candy distlocks"

# --- CONFIGURACIÓN DE OPTIMIZACIÓN Y PARALELISMO ---

MAKEOPTS="--jobs 16 --load-average 15"
EMERGE_DEFAULT_OPTS="--jobs=16 --load-average=15 --autounmask=y --autounmask-write=y --with-bdeps=y --complete-graph=y"

# --- CONFIGURACIÓN DE HARDWARE Y ENTORNO ---
INPUT_DEVICES="libinput"

# Define los objetivos de compilación para LLVM
LLVM_TARGETS="AMDGPU X86"

# Define la arquitectura específica de tu APU (Cezanne)
AMDGPU_TARGETS="gfx90c"
GALLIUM_DRIVERS="radeonsi"

VIDEO_CARDS="amdgpu radeonsi radeon"
OFFICE_IMPLEMENTATION="libreoffice"
LIBREOFFICE_EXTENSIONS="nlpsolver scripting-beanshell scripting-javascript wiki-publisher presenter-console presenter-minimizer"

# --- AJUSTES DE BOOTLOADER
DRACUT_MODULES="plymouth"
GRUB_PLATFORMS="efi-64"

# --- AJUSTE GLOBAL DE USES ---
USE="smp btrfs network dbus udev elogind -systemd policykit git zstd lto \
     lm-sensors bcrypt amdgpu bluetooth tkip wifi mtp java npm pgo \
     wayland vulkan gles2 egl opengl vaapi vdpau opencl llvm gtk \
     gtk4 audio sndio mp3 ogg playlist cue opus twolame wavpack \
     sndfile cdio lame webdav mms modplug ffmpeg taglib vcd discid \
     fingerprints mp4 x265 x264 openh264 vpx webp jpeg svg tiff png \
     vorbis theora gimp truetype sdl pipewire sound-server \
     pulseaudio echo-cancel jack openal portaudio mercurial extra tray \
     backlight evdev gps mpd mpris niri appindicator teamd utils \
     screencast gstreamer cube initramfs dracut introspection \
     plymouth drm pango freetype minizip custom-modes minimal xvfb \
     xcsecurity xephyr xnest xorg unwind compress-zstd joystick amf \
     system-llvm graphite vlc custom-cflags -abi_x86_32 -nvidia \
     -intel cups postscript lua xpm wmf wow64 samba scanner perl netapi \
     smartcard modemmanager python -telemetry hwaccel tk \
     verify-sig verify-provenance bash-completion"

