     dts dvd dvdr echo-cancel egl elogind encode evdev exif extra \
     ffmpeg fftw fingerprints flac fontconfig freetype fuse \
     gamepad gdbm gdk-pixbuf gif gimp git gles2 gpm gps graph graphite \
     grub gstreamer gtk gtk2 gtk3 gtk4 gui harfbuzz hwaccel icons \
     iconv icu imagemagick introspection ipv6 jack jack-client java \
     joystick jpeg jpegxl justify lame lcms led libcamera liblc3 \
     libnotify libproxy libtirpc llvm lm-sensors lua mad magic \
     markdown matroska mercurial minizip mms mng mod modemmanager \
     modplug mp3 mp4 mpd mpeg mpris mtp multilib multimedia ncurses \
     netapi network nfs niri nls npm ocr ogg openal opengl openh264 \
     openmp opus pam pango pcre pdf perl pgo pipewire playlist \
     plugins plymouth png policykit portaudio postproc postscript \
