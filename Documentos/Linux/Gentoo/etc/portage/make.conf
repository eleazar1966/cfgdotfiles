# --- OPTIMIZACIONES DE HARDWARE (Zen 3 - Cezanne) ---
# Se utiliza znver3 para aprovechar la arquitectura del Ryzen 5700G.
# -O3 y LTO mejoran el rendimiento; -flto=8 limita el uso de memoria durante el enlace.
COMMON_FLAGS="-march=znver3 -O3 -pipe -flto=8 -fgraphite-identity -floop-nest-optimize"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# Flags de CPU detectados para Zen 3 (Sin AVX-512).
CPU_FLAGS_X86="aes avx avx2 bmi1 bmi2 f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 sse4a ssse3 vpclmulqdq"

# --- CONFIGURACIÓN DE PARALELISMO (Optimizado para 32GB RAM) ---
# -j9 permite compilación rápida dejando hilos libres para el sistema.
# -l8 evita que la carga del sistema ahogue la memoria RAM disponible.
#MAKEOPTS="-j16 -l12"
#EMERGE_DEFAULT_OPTS="--jobs=1 --load-average=12.0 --autounmask=y --autounmask-write=y --with-bdeps=y --complete-graph=y --quiet-build=y"

# --- GRÁFICOS (Vega 8 integrada - gfx90c) ---
# Configuración específica para la GPU integrada del 5700G.
VIDEO_CARDS="amdgpu radeonsi radeon"
AMDGPU_TARGETS="gfx90c"
LLVM_TARGETS="AMDGPU X86"
RUSTFLAGS="-C target-cpu=znver3 -C opt-level=3"

# --- LOCALIZACIÓN ---
LINGUAS="es"
L10N="es-ES es"
LANG="es_ES.utf8"
LC_MESSAGES="C.utf8"

# --- GESTIÓN DE PORTAGE ---
ACCEPT_LICENSE="*"
ACCEPT_KEYWORDS="~amd64"
PORTAGE_TMPDIR="/var/tmp"
PORTAGE_COMPRESS="zstd"
PORTAGE_COMPRESS_FLAGS="-19"
# Features para una gestión limpia y paralela de la descarga e instalación.
#FEATURES="parallel-fetch parallel-install clean-logs candy distlocks buildpkg -pid-sandbox"
FEATURES="parallel-fetch parallel-install clean-logs candy distlocks buildpkg"
PORTDIR="/var/db/repos/gentoo"
DISTDIR="/var/cache/distfiles"
PKGDIR="/var/cache/binpkgs"
PORTAGE_LOGDIR="/var/log/portage"
PORTAGE_NICENESS="19"
PORTAGE_IONICE_COMMAND='ionice -c 3 -p \${PID}'
BINPKG_FORMAT="gpkg"

# --- AJUSTES DE SISTEMA ---
GRUB_PLATFORMS="efi-64"
OFFICE_IMPLEMENTATION="libreoffice"

# --- USE FLAGS (Mantenidas y saneadas para evitar conflictos) ---
