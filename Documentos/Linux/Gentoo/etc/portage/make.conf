# --- OPTIMIZACIONES DE HARDWARE (Zen 3 - Cezanne) ---
# Se utiliza znver3 para aprovechar la arquitectura del Ryzen 5700G.
# -O3 y LTO mejoran el rendimiento; -flto=8 limita el uso de memoria durante el enlace.
COMMON_FLAGS="-march=znver3 -O3 -pipe -flto=8 -fgraphite-identity -floop-nest-optimize"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

CPU_FLAGS_X86="aes avx avx2 bmi1 bmi2 f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 sse4a ssse3 vaes vpclmulqdq"

MAKEOPTS="-j16 -l15.5"
EMERGE_DEFAULT_OPTS="--jobs=1 --load-average=16.0 --autounmask=y --autounmask-write=y --with-bdeps=y --complete-graph=y --quiet-build=y"

# Configuración específica para la GPU integrada del 5700G.
VIDEO_CARDS="amdgpu radeonsi"
AMDGPU_TARGETS="gfx90c"
LLVM_TARGETS="AMDGPU X86"
RUSTFLAGS="-C target-cpu=znver3 -C opt-level=3"

# --- LOCALIZACIÓN ---
LINGUAS="es"
L10N="es-ES es"
LANG="es_ES.utf8"
LC_MESSAGES="C.utf8"

# --- GESTIÓN DE PORTAGE ---
ACCEPT_LICENSE="*"
ACCEPT_KEYWORDS="~amd64"
PORTAGE_TMPDIR="/var/tmp"
PORTAGE_COMPRESS="zstd"
PORTAGE_COMPRESS_FLAGS="-19"

FEATURES="ccache parallel-fetch parallel-install clean-logs candy distlocks "
PORTDIR="/var/db/repos/gentoo"
DISTDIR="/var/cache/distfiles"
PORTAGE_LOGDIR="/var/log/portage"
PORTAGE_NICENESS="19"
PORTAGE_IONICE_COMMAND='ionice -c 3 -p \${PID}'
BINPKG_FORMAT="gpkg"

# --- AJUSTES DE SISTEMA ---
GRUB_PLATFORMS="efi-64"
OFFICE_IMPLEMENTATION="libreoffice"

# --- USE FLAGS (Mantenidas y saneadas para evitar conflictos) ---
USE="X a52 aac acl acpi amdgpu amf apng appindicator archive audio avif \
     backlight bash-completion bcrypt bluetooth branding btrfs \
